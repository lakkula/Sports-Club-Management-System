<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard – Sports Manager</title>
</head>

<body>
    <aside id="nav"></aside>
    <main>
        <h2>Dashboard</h2>
        <div class="stats">
            <div class="card"><b id="players">0</b>Players</div>
            <div class="card"><b id="teams">0</b>Teams</div>
            <div class="card"><b id="upcoming">0</b>Upcoming events</div>
        </div>
        <div class="cols">
            <section class="card">
                <h3>Upcoming events</h3>
                <div id="upList"></div>
            </section>
            <section class="card">
                <h3>Recent registrations</h3>
                <div id="recent"></div>
            </section>
        </div>
    </main>
</body>

</html>
